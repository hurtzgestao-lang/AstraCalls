name: astracalls

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: astracalls
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - astracalls_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astracalls -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  astracalls:
    image: hurtz-astracalls:${ASTRACALLS_GIT_SHA:?ASTRACALLS_GIT_SHA is required}
    build:
      context: ../..
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${ASTRACALLS_GIT_SHA}
        org.opencontainers.image.source: https://github.com/hurtzgestao-lang/AstraCalls
    restart: unless-stopped
    network_mode: host
    environment:
      WACALLS_PG_URL: postgres://astracalls:${POSTGRES_PASSWORD}@127.0.0.1:55433/postgres?sslmode=disable
      WACALLS_PG_NAMESPACE: hurtz_calls
      WACALLS_API_KEY: ${WACALLS_API_KEY:?WACALLS_API_KEY is required}
      WACALLS_ALLOWED_ORIGINS: https://calls.hurtzcompany.com.br,https://crm.hurtzcompany.com.br
      WACALLS_PUBLIC_IP: 173.249.22.212
      WACALLS_UDP_PORT: "50000"
      WACALLS_MAX_CALLS: "8"
      WACALLS_ENABLE_MESSAGES: "false"
      WACALLS_ENABLE_CHATWOOT_MESSAGES: "false"
      WACALLS_RECORDINGS_DIR: /var/lib/astracalls/recordings
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - astracalls_recordings_tmp:/var/lib/astracalls/recordings
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - hurtz_proxy
    depends_on:
      astracalls:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: hurtz_crm_prod_proxy
      traefik.http.routers.astracalls.rule: Host(`calls.hurtzcompany.com.br`)
      traefik.http.routers.astracalls.entrypoints: websecure
      traefik.http.routers.astracalls.tls: "true"
      traefik.http.routers.astracalls.tls.certresolver: letsencrypt
      traefik.http.services.astracalls.loadbalancer.server.port: "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  astracalls_postgres:
  astracalls_recordings_tmp:

networks:
  hurtz_proxy:
    external: true
    name: hurtz_crm_prod_proxy
